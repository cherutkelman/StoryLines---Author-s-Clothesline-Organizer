
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryLines - מארגן עלילה לסופרים</title>
    <meta name="theme-color" content="#78350f">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fdf6e3;
            --sidebar-bg: #f5e6d3;
            --card-bg: #ffffff;
            --text: #78350f;
            --border: #fde68a;
            --accent: #d97706;
            --secondary-text: #92400e;
            --hover: #fef3c7;
        }
        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .handwritten {
            font-family: 'Amatic SC', cursive;
        }
        /* Soft, theme-aware scrollbars for Firefox and WebKit browsers. */
        .storylines-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: var(--theme-border, var(--border)) var(--theme-secondary, var(--hover));
            scrollbar-color:
                color-mix(in srgb, var(--theme-primary, var(--text)) 32%, transparent)
                color-mix(in srgb, var(--theme-secondary, var(--hover)) 48%, transparent);
        }
        .storylines-scrollbar::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .storylines-scrollbar::-webkit-scrollbar-track {
            background: var(--theme-secondary, var(--hover));
            background: color-mix(in srgb, var(--theme-secondary, var(--hover)) 48%, transparent);
            border-radius: 999px;
        }
        .storylines-scrollbar::-webkit-scrollbar-thumb {
            min-width: 36px;
            min-height: 36px;
            border: 2px solid transparent;
            border-radius: 999px;
            background-color: var(--theme-border, var(--border));
            background-color: color-mix(in srgb, var(--theme-primary, var(--text)) 32%, transparent);
            background-clip: content-box;
        }
        .storylines-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: var(--theme-accent, var(--accent));
            background-color: color-mix(in srgb, var(--theme-accent, var(--accent)) 48%, transparent);
        }
        .storylines-scrollbar::-webkit-scrollbar-corner {
            background: transparent;
        }
        .storylines-scrollbar::-webkit-scrollbar-button {
            display: none;
            width: 0;
            height: 0;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .scrollbar-hide {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
    "vite-plugin-singlefile": "https://esm.sh/vite-plugin-singlefile@^2.3.0"
  }
}
</script>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Only register service worker if served over HTTPS or localhost (required for PWA)
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
      } else {
        console.log('Running in local file mode or insecure context. PWA features (Offline/Install) might be limited.');
      }
    </script>
</body>
</html>
